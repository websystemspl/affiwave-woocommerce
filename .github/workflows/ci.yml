name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', coverage: none }
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      # The plugin runs on PHP 8.1; its test tools (PHPUnit 11) need 8.2+, so 8.1 is lint-only.
      - if: matrix.php != '8.1'
        run: composer install --no-progress
      - if: matrix.php != '8.1'
        run: vendor/bin/phpunit
